<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="West of England Mayoral Combined Authority Data Lab">
<title>West of England Data Lab</title>
<link rel="stylesheet" href="https://use.typekit.net/lkt5fce.css">
<style>
* { box-sizing: border-box; }

:root {
  --west-green: #40A832;
  --park-green: #007D00;
  --forest-green: #1D4F2B;
  --dark-green: #13301B;
  --soft-green: #99CB99;
  --light-green: #D9EDD9;
  --rich-purple: #590075;
  --soft-purple: #9C66AB;
  --light-purple: #FDF7FF;
  --mayor-pink: #EA005D;
  --mayor-pink-dark: #BE004B;
  --almost-black: #1F1F1F;
  --grey: #3C3C3C;
  --warm-grey: #A6A6A5;
  --light-grey: #E5E5E5;
  --lightest-grey: #F2F2F2;
  --white: #ffffff;
  --background-cream: #F4F0E8;
  --background-cream-light: #F9F7F4;
  --hyperlink-blue: #086CA6;
  --focus-yellow: #FFCF23;
  --red: #CE132D;
  --soft-red: #ED8073;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Open Sans", sans-serif;
  font-size: 1.0625rem;
  line-height: 1.5;
  color: var(--almost-black);
}

@keyframes spin-slow { 
  from { transform: rotate(0deg); } 
  to { transform: rotate(360deg); } 
}

@keyframes spin-rev { 
  from { transform: rotate(0deg); } 
  to { transform: rotate(-360deg); } 
}

@keyframes drift {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(180deg); }
}

.dl-hero {
  position: relative;
  width: 100%;
  min-height: 320px;
  background: linear-gradient(135deg, var(--dark-green) 0%, var(--forest-green) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 2rem 1.5rem;
}

.dl-hero-bg {
  position: absolute;
  inset: 0;
  background: transparent;
}

.dl-penta-canvas { 
  position: absolute; 
  inset: 0; 
  width: 100%; 
  height: 100%;
}

.dl-hero-content { 
  position: relative; 
  z-index: 10; 
  text-align: center;
  max-width: 90%;
}

.dl-hero-label {
  display: inline-block;
  font-size: clamp(0.6875rem, 2vw, 0.875rem);
  font-family: AvenirPro65Medium, sans-serif;
  font-weight: normal;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: clamp(0.75rem, 3vw, 1rem);
}

.dl-hero-title {
  font-family: AvenirPro85Heavy, sans-serif;
  font-weight: normal;
  font-size: clamp(1.875rem, 6vw, 2.75rem);
  line-height: 1.15;
  color: var(--white);
  margin: 0;
  letter-spacing: -0.02em;
}

.dl-hero-title span { 
  color: var(--west-green);
  display: block;
}

/* Tablet styles */
@media (min-width: 640px) {
  .dl-hero {
    min-height: 400px;
    padding: 3rem 2rem;
  }
  
  .dl-hero-title {
    font-size: clamp(2rem, 5vw, 2.75rem);
  }
}

/* Desktop styles */
@media (min-width: 1024px) {
  .dl-hero {
    min-height: 480px;
    padding: 4rem 3rem;
  }
  
  .dl-hero-content {
    max-width: 100%;
  }
}

/* Large desktop */
@media (min-width: 1440px) {
  .dl-hero {
    min-height: 520px;
  }
}

/* Mobile landscape */
@media (max-height: 600px) and (orientation: landscape) {
  .dl-hero {
    min-height: 280px;
  }
  
  .dl-penta-canvas {
    opacity: 0.6;
  }
}
</style>

<div class="dl-hero">
  <div class="dl-hero-bg"></div>
  <svg class="dl-penta-canvas" viewBox="0 0 680 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g style="transform-origin:80px 60px;animation:spin-slow 18s linear infinite"><polygon points="80,30 104,48 95,76 65,76 56,48" fill="none" stroke="#40A832" stroke-width="1.5" opacity="0.6"/></g>
    <g style="transform-origin:80px 60px;animation:spin-slow 28s linear infinite"><polygon points="80,18 112,42 100,82 60,82 48,42" fill="none" stroke="#99CB99" stroke-width="0.5" opacity="0.3"/></g>
    <g style="transform-origin:580px 80px;animation:spin-rev 22s linear infinite"><polygon points="580,50 604,68 595,96 565,96 556,68" fill="none" stroke="#40A832" stroke-width="1.5" opacity="0.5"/></g>
    <g style="transform-origin:580px 80px;animation:spin-rev 35s linear infinite"><polygon points="580,35 612,59 600,100 560,100 548,59" fill="none" stroke="#D9EDD9" stroke-width="0.5" opacity="0.25"/></g>
    <g style="transform-origin:620px 250px;animation:spin-slow 25s linear infinite"><polygon points="620,225 641,241 633,265 607,265 599,241" fill="#40A832" opacity="0.15"/><polygon points="620,225 641,241 633,265 607,265 599,241" fill="none" stroke="#99CB99" stroke-width="1" opacity="0.5"/></g>
    <g style="transform-origin:60px 260px;animation:spin-rev 20s linear infinite"><polygon points="60,238 78,251 71,272 49,272 42,251" fill="#007D00" opacity="0.2"/><polygon points="60,238 78,251 71,272 49,272 42,251" fill="none" stroke="#40A832" stroke-width="1" opacity="0.4"/></g>
    <g style="transform-origin:340px 30px;animation:drift 12s ease-in-out infinite"><polygon points="340,10 356,22 350,40 330,40 324,22" fill="none" stroke="#D9EDD9" stroke-width="1" opacity="0.4"/></g>
    <g style="transform-origin:170px 280px;animation:drift 16s ease-in-out infinite 2s"><polygon points="170,265 183,274 178,291 162,291 157,274" fill="none" stroke="#99CB99" stroke-width="1" opacity="0.35"/></g>
    <g style="transform-origin:490px 290px;animation:spin-slow 30s linear infinite 5s"><polygon points="490,272 506,284 500,303 480,303 474,284" fill="#40A832" opacity="0.15"/><polygon points="490,272 506,284 500,303 480,303 474,284" fill="none" stroke="#D9EDD9" stroke-width="1" opacity="0.4"/></g>
    <g style="transform-origin:250px 60px;animation:spin-rev 24s linear infinite 3s"><polygon points="250,42 264,52 259,68 241,68 236,52" fill="none" stroke="#D9EDD9" stroke-width="1" opacity="0.3"/></g>
    <g style="transform-origin:430px 120px;animation:drift 20s ease-in-out infinite 7s"><polygon points="430,105 445,116 439,134 421,134 415,116" fill="none" stroke="#40A832" stroke-width="1.5" opacity="0.4"/></g>
    <g style="transform-origin:140px 160px;animation:spin-slow 40s linear infinite 1s"><polygon points="140,145 153,155 148,172 132,172 127,155" fill="none" stroke="#D9EDD9" stroke-width="0.5" opacity="0.25"/></g>
  </svg>
  <div class="dl-hero-content">
    <div class="dl-hero-label">Mayoral Combined Authority</div>
    <h1 class="dl-hero-title">West of England <span>Data Lab</span></h1>
  </div>
</div>
